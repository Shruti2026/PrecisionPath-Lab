spring:
  datasource:
    url: jdbc:h2:mem:lab_service_test;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

jwt:
  secret: test-secret-key-that-is-at-least-32-bytes-long!!

app:
  internal-api-key: test-internal-key
  storage:
    location: ./target/test-uploads
  booking:
    min-reason-words: 50
    max-days-in-advance: 90

services:
  user-service:
    url: http://localhost:0
